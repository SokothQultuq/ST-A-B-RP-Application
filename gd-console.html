<html lang="en">

<link rel="stylesheet" href="style.css">
<script src="utils.js"></script>
</head>
<body>
<div class="app-frame">
  <div class="nav-links">
    <a href="index.html">&larr; Demo Home</a>
    <a href="character-sheet.html">Character Sheet</a>
    <a href="engineering.html">Engineering</a>
    <a href="tactical.html">Tactical</a>
    <a href="medical.html">Medical</a>
    <a href="science.html">Science</a>
    <a href="security.html">Security</a>
    <a href="navigation.html">Navigation</a>
    <a href="npc-ships.html">NPC Ship Library</a>
    <a href="inventory.html">Inventory</a>
  </div>
  <div class="top-bar">
    <div>
      <div class="eyebrow">Game Director Console</div>
      <div class="title" style="font-size:20px;">USS Tempest &middot; Master Control</div>
    </div>
    <div class="row gap-8" id="alert-buttons"></div>
  </div>
  <div class="row gap-6 wrap" id="tabs" style="margin-bottom:14px;"></div>
  <div id="tab-content"></div>

  <div class="chat-box" id="ship-chat"></div>
</div>

<script>
const BASE_ACCENT = '#4a9eff';
const STATE = loadState('gd-console', {
  alertLevel: 'normal', activeTab: 'tactical',
  gdShields: { forward:92, starboard:90, port:89, dorsal:91, aft:45, ventral:60 },
  attackDamage: '20', attackZone: 'random', attackLog: '',
  gdEngSystems: { warp:96, impulse:100, slipstream:75, lifesupport:100, power:100, structural:97, rcs:90 },
  engDamage: '15', engDamageTarget: 'warp', engLog: '',
  templateDraft: 'tpl-kbop',
  npcInstances: [
    { id:'gd-inst-1', designation:'Hunter Vessel Alpha', origin:'Klingon', className:"B'rel-class Bird-of-Prey", templateName:'Klingon Bird-of-Prey', lifeSigns:'12', sysShields:'75', sysWeapons:'80', sysEngines:'85', sysSensors:'70', notes:'', damageLog:[] }
  ],
  genDesignation: '', genOrigin: '', genClass: '', genLifeSigns: '', genShields: '80', genWeapons: '80', genEngines: '80', genSensors: '80',
  medQuickName: '', medQuickSeverity: 'Minor Injury', casualtyScenario: 'small_explosion', gdPatients: [],
  secQuickName: '', secBrigOccupied: 0,
  shipChatLog: [
    { from: 'GD', text: 'Session resuming shortly.' },
    { from: "Cmdr. T'Lira Vash", text: 'Standing by.' }
  ]
});
function persist() { saveState('gd-console', STATE); }
function applyTheme() { applyAlertTheme(STATE.alertLevel, BASE_ACCENT); }
function statusColor(pct) { const n=parseFloat(pct); if(isNaN(n)) return '#9fb3c0'; return n>=80?'#7fb069':n>=50?'#e8a33d':'#e05d5d'; }

const TABS = [
  { key:'tactical', label:'Tactical' }, { key:'engineering', label:'Engineering' }, { key:'science', label:'Science' },
  { key:'medical', label:'Medical' }, { key:'security', label:'Security' }, { key:'navigation', label:'Navigation' },
  { key:'characters', label:'Player Characters' }, { key:'npcships', label:'NPC Ships' }
];
const TEMPLATE_OPTIONS = [
  { id:'tpl-kbop', name:'Klingon Bird-of-Prey', origin:'Klingon', className:"B'rel-class", lifeSigns:'12', sysShields:'75', sysWeapons:'80', sysEngines:'85', sysSensors:'70' },
  { id:'tpl-ferm', name:'Ferengi Marauder', origin:'Ferengi', className:"D'Kora-class", lifeSigns:'60', sysShields:'60', sysWeapons:'55', sysEngines:'65', sysSensors:'75' }
];
const CHARACTERS = [
  { name:'Cmdr. T\u2019Lira Vash', rank:'Commander', position:'Executive Officer', status:'On Duty', color:'#7fb069' },
  { name:'Lt. Marcus Kade', rank:'Lieutenant', position:'Chief of Security', status:'On Duty', color:'#7fb069' },
  { name:'Ens. Sara Ohin', rank:'Ensign', position:'Science Officer', status:'Off Duty', color:'#6b7d89' },
  { name:'Lt. Cmdr. Dael Ferro', rank:'Lt. Commander', position:'Chief Engineering Officer', status:'Away Team', color:'#e8a33d' }
];

function renderAlertButtons() {
  const wrap = document.getElementById('alert-buttons'); wrap.innerHTML = '';
  ['normal','yellow','red'].forEach((lvl) => {
    const labels = { normal:'Normal', yellow:'Yellow Alert', red:'Red Alert' };
    wrap.appendChild(el('button', { class:'btn'+(STATE.alertLevel===lvl?' btn-accent':''), onclick: () => { STATE.alertLevel=lvl; persist(); applyTheme(); renderAlertButtons(); } }, labels[lvl]));
  });
}

function renderTabs() {
  const wrap = document.getElementById('tabs'); wrap.innerHTML = '';
  TABS.forEach((t) => wrap.appendChild(el('button', { class:'btn'+(STATE.activeTab===t.key?' btn-accent':''), onclick: () => { STATE.activeTab=t.key; persist(); renderContent(); } }, t.label)));
}

function placeholderPanel(title, text) {
  return el('div', { class:'panel' }, [el('div',{class:'panel-h'},title), el('div',{class:'small faint'},text)]);
}

function renderTacticalTab(c) {
  const p = el('div', { class:'panel' });
  p.appendChild(el('div', { class:'panel-h' }, 'SHIELDS — QUICK CONTROL'));
  p.appendChild(el('div', { class:'tiny dimmer', style:'margin-bottom:12px;' }, 'Direct field edits for GD use. Change a value manually, or auto-resolve an incoming attack.'));
  const grid = el('div', { class:'grid g6', style:'margin-bottom:14px;' });
  Object.entries(STATE.gdShields).forEach(([key,val]) => {
    const input = el('input', { type:'text', value: val });
    input.onchange = (e) => { STATE.gdShields[key] = Math.max(0,Math.min(100,parseInt(e.target.value,10)||0)); persist(); };
    grid.appendChild(el('div', { class:'col' }, [el('label',{class:'label'},key.charAt(0).toUpperCase()+key.slice(1)), input]));
  });
  p.appendChild(grid);
  const row = el('div', { class:'row items-end gap-8 wrap' });
  const dmgIn = el('input',{type:'text',value:STATE.attackDamage,style:'width:160px;'}); dmgIn.onchange=(e)=>{STATE.attackDamage=e.target.value;persist();};
  const zoneSel = el('select', { style:'flex-grow:1; min-width:160px;' });
  zoneSel.appendChild(el('option',{value:'random'},'Random'));
  Object.keys(STATE.gdShields).forEach(k=>zoneSel.appendChild(el('option',{value:k},k.charAt(0).toUpperCase()+k.slice(1))));
  zoneSel.value = STATE.attackZone; zoneSel.onchange=(e)=>{STATE.attackZone=e.target.value;persist();};
  row.appendChild(el('div',{class:'col',style:'width:160px;'},[el('label',{class:'label'},'Attack Damage'),dmgIn]));
  row.appendChild(el('div',{class:'col flex-grow',style:'min-width:160px;'},[el('label',{class:'label'},'Target Zone'),zoneSel]));
  row.appendChild(el('button', { class:'btn btn-accent', onclick: () => {
    const dmg = Math.max(0, parseInt(STATE.attackDamage,10)||0);
    const keys = Object.keys(STATE.gdShields);
    const target = STATE.attackZone==='random' ? keys[Math.floor(Math.random()*keys.length)] : STATE.attackZone;
    const next = Math.max(0, STATE.gdShields[target]-dmg);
    STATE.gdShields[target] = next;
    STATE.attackLog = 'Enemy attack resolved: '+target.charAt(0).toUpperCase()+target.slice(1)+' shield hit for '+dmg+' \u2014 now '+next+'%.';
    persist(); renderContent();
  } }, 'Resolve Enemy Attack'));
  p.appendChild(row);
  if (STATE.attackLog) p.appendChild(el('div', { class:'tiny', style:'color:#e8a33d; margin-top:10px;' }, STATE.attackLog));
  c.appendChild(p);
  c.appendChild(el('div', { class:'panel' }, [
    el('div',{class:'panel-h'},'TACTICAL — FULL CONSOLE'),
    el('div',{class:'small dim',style:'margin-bottom:12px;'},'Weapons fire, sensor contacts, targeting, communications, and transporter control — the same visual station a Tactical Officer plays from.'),
    el('a',{class:'link-btn',href:'tactical.html'},'Open Full Tactical Console \u2192')
  ]));
}

function renderEngineeringTab(c) {
  const p = el('div', { class:'panel' });
  p.appendChild(el('div', { class:'panel-h' }, 'SHIP SYSTEMS — QUICK CONTROL'));
  p.appendChild(el('div', { class:'tiny dimmer', style:'margin-bottom:12px;' }, 'Direct field edits for GD use, or auto-resolve system damage.'));
  const labels = { warp:'Warp Drive', impulse:'Impulse Drive', slipstream:'Slipstream', lifesupport:'Life Support', power:'Emergency Power', structural:'Structural Integrity', rcs:'RCS Thrusters' };
  const grid = el('div', { class:'grid g4', style:'margin-bottom:14px;' });
  Object.entries(STATE.gdEngSystems).forEach(([key,val]) => {
    const input = el('input', { type:'text', value: val });
    input.onchange = (e) => { STATE.gdEngSystems[key] = Math.max(0,Math.min(100,parseInt(e.target.value,10)||0)); persist(); };
    grid.appendChild(el('div', { class:'col' }, [el('label',{class:'label'},labels[key]), input]));
  });
  p.appendChild(grid);
  const row = el('div', { class:'row items-end gap-8 wrap' });
  const dmgIn = el('input',{type:'text',value:STATE.engDamage,style:'width:160px;'}); dmgIn.onchange=(e)=>{STATE.engDamage=e.target.value;persist();};
  const sysSel = el('select', { style:'flex-grow:1; min-width:160px;' });
  Object.keys(STATE.gdEngSystems).forEach(k=>sysSel.appendChild(el('option',{value:k},labels[k])));
  sysSel.value = STATE.engDamageTarget; sysSel.onchange=(e)=>{STATE.engDamageTarget=e.target.value;persist();};
  row.appendChild(el('div',{class:'col',style:'width:160px;'},[el('label',{class:'label'},'Damage Amount'),dmgIn]));
  row.appendChild(el('div',{class:'col flex-grow',style:'min-width:160px;'},[el('label',{class:'label'},'System'),sysSel]));
  row.appendChild(el('button', { class:'btn btn-accent', onclick: () => {
    const dmg = Math.max(0, parseInt(STATE.engDamage,10)||0);
    const next = Math.max(0, STATE.gdEngSystems[STATE.engDamageTarget]-dmg);
    STATE.gdEngSystems[STATE.engDamageTarget] = next;
    STATE.engLog = labels[STATE.engDamageTarget]+' took '+dmg+' damage \u2014 now '+next+'%.';
    persist(); renderContent();
  } }, 'Resolve System Damage'));
  p.appendChild(row);
  if (STATE.engLog) p.appendChild(el('div', { class:'tiny', style:'color:#e8a33d; margin-top:10px;' }, STATE.engLog));
  c.appendChild(p);
  c.appendChild(el('div', { class:'panel' }, [
    el('div',{class:'panel-h'},'ENGINEERING — FULL CONSOLE'),
    el('div',{class:'small dim',style:'margin-bottom:12px;'},'System status detail, reactor management, shield generators, RCS thrusters, and Damage Control crew dispatch.'),
    el('a',{class:'link-btn',href:'engineering.html'},'Open Full Engineering Console \u2192')
  ]));
}

function renderCharactersTab(c) {
  const p = el('div', { class:'panel' });
  p.appendChild(el('div', { class:'panel-h' }, 'PLAYER CHARACTERS'));
  CHARACTERS.forEach((ch) => {
    p.appendChild(el('div', { class:'row justify-between items-center card' }, [
      el('div', {}, [el('div',{style:'font-weight:600;'},ch.name), el('div',{class:'tiny dim'},ch.rank+' \u00b7 '+ch.position)]),
      el('div', { class:'row items-center gap-14' }, [el('div',{class:'tiny',style:'color:'+ch.color+';'},ch.status), el('a',{class:'link-btn',style:'padding:6px 12px; font-size:12px;',href:'character-sheet.html'},'View Sheet \u2192')])
    ]));
  });
  c.appendChild(p);
}

const DAMAGE_TARGETS = ['Shields','Weapons','Engines','Sensors','Life Signs'];
const DAMAGE_FIELD_MAP = {Shields:'sysShields',Weapons:'sysWeapons',Engines:'sysEngines',Sensors:'sysSensors','Life Signs':'lifeSigns'};

const MED_SEVERITIES = ['Minor Injury', 'Under Medical Care', 'Critical'];
const MED_SEVERITY_COLOR = { 'Minor Injury': '#e8a33d', 'Under Medical Care': '#e8a33d', 'Critical': '#e05d5d' };
const SCENARIOS = [
  { key: 'small_explosion', label: 'Small Explosion', countMin: 1, countMax: 2, weights: [0.40, 0.45, 0.15] },
  { key: 'medium_explosion', label: 'Medium Explosion', countMin: 2, countMax: 4, weights: [0.20, 0.45, 0.35] },
  { key: 'large_explosion', label: 'Large Explosion', countMin: 4, countMax: 8, weights: [0.10, 0.35, 0.55] },
  { key: 'console_explosion', label: 'Console Explosion', countMin: 1, countMax: 1, weights: [0.20, 0.50, 0.30] },
  { key: 'fall_height', label: 'Fall from Height', countMin: 1, countMax: 1, weights: [0.35, 0.40, 0.25] },
  { key: 'sports_injury', label: 'Sports Injury', countMin: 1, countMax: 1, weights: [0.80, 0.20, 0.00] },
  { key: 'phaser_shot', label: 'Shot by Phaser', countMin: 1, countMax: 1, weights: [0.15, 0.55, 0.30] },
  { key: 'disruptor_shot', label: 'Shot by Disruptor', countMin: 1, countMax: 1, weights: [0.05, 0.35, 0.60] },
  { key: 'radiation_exposure', label: 'Radiation Exposure', countMin: 1, countMax: 3, weights: [0.20, 0.40, 0.40] },
  { key: 'toxic_exposure', label: 'Toxic / Biohazard Exposure', countMin: 1, countMax: 2, weights: [0.25, 0.45, 0.30] },
  { key: 'vacuum_exposure', label: 'Vacuum / Hull Breach Exposure', countMin: 1, countMax: 4, weights: [0.10, 0.30, 0.60] },
  { key: 'plasma_burn', label: 'Plasma Conduit Burn', countMin: 1, countMax: 2, weights: [0.25, 0.45, 0.30] },
  { key: 'melee_injury', label: 'Hand-to-Hand Combat Injury', countMin: 1, countMax: 2, weights: [0.45, 0.40, 0.15] },
  { key: 'psychological_trauma', label: 'Psychological Trauma / Shock', countMin: 1, countMax: 2, weights: [0.60, 0.35, 0.05] }
];
const NAME_RANKS = ['Crewman', 'Ensign', 'Lt. j.g.', 'Lieutenant', 'PO2', 'CPO'];
const NAME_SURNAMES = ['Okafor', 'Ramirez', 'Delgado', 'Sato', 'Kowalski', 'Ibsen', 'Chen', 'Okoye', 'Novak', 'Pierce', 'Adeyemi', 'Larkin', 'Voss', 'Tanaka', 'Reyes'];
function weightedSeverity(weights) {
  const r = Math.random();
  if (r < weights[0]) return MED_SEVERITIES[0];
  if (r < weights[0] + weights[1]) return MED_SEVERITIES[1];
  return MED_SEVERITIES[2];
}
function randomName() { return NAME_RANKS[Math.floor(Math.random() * NAME_RANKS.length)] + ' ' + NAME_SURNAMES[Math.floor(Math.random() * NAME_SURNAMES.length)]; }

function renderMedicalTab(c) {
  const p = el('div', { class: 'panel' });
  p.appendChild(el('div', { class: 'panel-h' }, 'MEDICAL — QUICK CONTROL'));
  p.appendChild(el('div', { class: 'tiny dimmer', style: 'margin-bottom:12px;' }, 'Snapshot of staff/bed availability, plus quick ways to send patients to Medical.'));
  const grid = el('div', { class: 'grid g2', style: 'margin-bottom:14px;' });
  const medDefaults = { doctors: 42, nurses: 89, pediatricians: 16, counselors: 22, mortician: 2 };
  const medLabels = { doctors: 'Doctors', nurses: 'Nurses', pediatricians: 'Pediatricians', counselors: 'Counselors', mortician: 'Mortician' };
  const wardDefaults = { sickbay: 12, surgical: 4, icu: 6, critical: 6, trauma: 4, isolation: 2, radiation: 2, zerog: 2 };
  const wardLabels = { sickbay: 'Sickbay', surgical: 'Surgical Ward', icu: 'ICU', critical: 'Critical Care', trauma: 'Trauma Stasis', isolation: 'Biohazard Isolation', radiation: 'Radiation Treatment', zerog: 'Zero-G Care Unit' };
  const personnelCol = el('div', {}, [el('div', { class: 'tiny dimmer', style: 'text-transform:uppercase;letter-spacing:0.07em;margin-bottom:6px;' }, 'Personnel Free')]);
  Object.keys(medDefaults).forEach((k) => personnelCol.appendChild(el('div', { class: 'small dim' }, [medLabels[k] + ': ', el('span', { style: 'color:#7fb069;' }, String(medDefaults[k]))])));
  const wardCol = el('div', {}, [el('div', { class: 'tiny dimmer', style: 'text-transform:uppercase;letter-spacing:0.07em;margin-bottom:6px;' }, 'Beds Free')]);
  Object.keys(wardDefaults).forEach((k) => wardCol.appendChild(el('div', { class: 'small dim' }, [wardLabels[k] + ': ', el('span', { style: 'color:#7fb069;' }, String(wardDefaults[k]))])));
  grid.appendChild(personnelCol); grid.appendChild(wardCol);
  p.appendChild(grid);

  const row = el('div', { class: 'row items-end gap-8 wrap' });
  const nameIn = el('input', { type: 'text', value: STATE.medQuickName, style: 'width:100%;' }); nameIn.onchange = (e) => { STATE.medQuickName = e.target.value; persist(); };
  const sevSel = el('select', {});
  MED_SEVERITIES.forEach((s) => sevSel.appendChild(el('option', { value: s }, s)));
  sevSel.value = STATE.medQuickSeverity; sevSel.onchange = (e) => { STATE.medQuickSeverity = e.target.value; persist(); };
  row.appendChild(el('div', { class: 'col flex-grow', style: 'min-width:180px;' }, [el('label', { class: 'label' }, 'Patient Name'), nameIn]));
  row.appendChild(el('div', { class: 'col', style: 'width:180px;' }, [el('label', { class: 'label' }, 'Severity'), sevSel]));
  row.appendChild(el('button', { class: 'btn btn-accent', onclick: () => {
    const name = STATE.medQuickName.trim(); if (!name) return;
    STATE.gdPatients.push({ id: 'gdpt-' + Date.now(), name: name, severity: STATE.medQuickSeverity, cause: '', resolved: false });
    STATE.medQuickName = ''; persist(); renderContent();
  } }, 'Send to Medical'));
  p.appendChild(row);
  c.appendChild(p);

  const genPanel = el('div', { class: 'panel' });
  genPanel.appendChild(el('div', { class: 'panel-h' }, 'CASUALTY GENERATOR'));
  genPanel.appendChild(el('div', { class: 'tiny dimmer', style: 'margin-bottom:12px;' }, 'Pick a scenario and generate one or more casualties, sent straight to the Patient Roster below.'));
  const genRow = el('div', { class: 'row items-end gap-8 wrap' });
  const scenSel = el('select', { style: 'flex-grow:1; min-width:220px;' });
  SCENARIOS.forEach((s) => scenSel.appendChild(el('option', { value: s.key }, s.label)));
  scenSel.value = STATE.casualtyScenario; scenSel.onchange = (e) => { STATE.casualtyScenario = e.target.value; persist(); };
  genRow.appendChild(el('div', { class: 'col flex-grow', style: 'min-width:220px;' }, [el('label', { class: 'label' }, 'Scenario'), scenSel]));
  genRow.appendChild(el('button', { style: 'padding:10px 18px;border-radius:6px;border:1px solid #e8a33d;background:#e8a33d1f;color:#e8a33d;font-family:"IBM Plex Sans",sans-serif;font-size:13px;font-weight:700;cursor:pointer;', onclick: () => {
    const scenario = SCENARIOS.find((s) => s.key === STATE.casualtyScenario) || SCENARIOS[0];
    const count = scenario.countMin + Math.floor(Math.random() * (scenario.countMax - scenario.countMin + 1));
    for (let i = 0; i < count; i++) STATE.gdPatients.push({ id: 'gdpt-' + Date.now() + '-' + i + '-' + Math.floor(Math.random() * 1000), name: randomName(), severity: weightedSeverity(scenario.weights), cause: scenario.label, resolved: false });
    persist(); renderContent();
  } }, 'Generate Casualties'));
  genPanel.appendChild(genRow);
  c.appendChild(genPanel);

  const rosterPanel = el('div', { class: 'panel' });
  rosterPanel.appendChild(el('div', { class: 'panel-h' }, 'PATIENT ROSTER'));
  if (!STATE.gdPatients.length) rosterPanel.appendChild(el('div', { class: 'faint small' }, 'No patients sent to Medical yet.'));
  STATE.gdPatients.forEach((pt) => {
    rosterPanel.appendChild(el('div', { class: 'row justify-between items-center card' }, [
      el('div', {}, [el('div', { style: 'font-weight:600;' }, pt.name), el('div', { class: 'small', style: 'color:' + MED_SEVERITY_COLOR[pt.severity] + ';' }, pt.severity + (pt.cause ? ' \u00b7 ' + pt.cause : ''))]),
      pt.resolved ? el('div', { class: 'small', style: 'color:#7fb069;' }, 'Discharged \u2713') : el('button', { class: 'btn btn-sm', onclick: () => { pt.resolved = true; persist(); renderContent(); } }, 'Resolve / Discharge')
    ]));
  });
  c.appendChild(rosterPanel);

  c.appendChild(el('div', { class: 'panel' }, [
    el('div', { class: 'panel-h' }, 'MEDICAL — FULL CONSOLE'),
    el('div', { class: 'small dim', style: 'margin-bottom:12px;' }, 'Sickbay wards/beds, personnel pool, and full patient admission & assignment workflow.'),
    el('a', { class: 'link-btn', href: 'medical.html' }, 'Open Full Medical Console \u2192')
  ]));
}

function renderScienceTab(c) {
  const p = el('div', { class: 'panel' });
  p.appendChild(el('div', { class: 'panel-h' }, 'SCIENCE — QUICK CONTROL'));
  p.appendChild(el('div', { class: 'tiny dimmer', style: 'margin-bottom:12px;' }, 'Snapshot of lab availability, plus a quick way to log a scan/analysis result.'));
  const labDefaults = { general: ['General Purpose Lab', 22], geology: ['Geology Lab', 5], astrometric: ['Astrometric Lab', 4], bioChem: ['Bio-Chem Lab', 6], physics: ['Physics Lab', 8], hydroponics: ['Hydroponics Lab', 5] };
  const labWrap = el('div', { style: 'margin-bottom:14px;' }, [el('div', { class: 'tiny dimmer', style: 'text-transform:uppercase;letter-spacing:0.07em;margin-bottom:6px;' }, 'Labs Free')]);
  Object.values(labDefaults).forEach(([label, total]) => labWrap.appendChild(el('div', { class: 'small dim' }, [label + ': ', el('span', { style: 'color:#7fb069;' }, String(total))])));
  p.appendChild(labWrap);
  const row = el('div', { class: 'row items-end gap-8 wrap' });
  const subjIn = el('input', { type: 'text', placeholder: 'e.g. Debris Field', value: STATE.sciQuickSubject || '', style: 'width:100%;' });
  subjIn.onchange = (e) => { STATE.sciQuickSubject = e.target.value; persist(); };
  row.appendChild(el('div', { class: 'col flex-grow', style: 'min-width:220px;' }, [el('label', { class: 'label' }, 'Subject'), subjIn]));
  row.appendChild(el('button', { class: 'btn btn-accent', onclick: () => {
    const subj = (STATE.sciQuickSubject || '').trim(); if (!subj) return;

    persist(); renderContent();
  } }, 'Log Scan Result'));
  p.appendChild(row);
  if (STATE.sciLogText) p.appendChild(el('div', { class: 'tiny', style: 'color:#e8a33d; margin-top:10px;' }, STATE.sciLogText));
  c.appendChild(p);
  c.appendChild(el('div', { class: 'panel' }, [
    el('div', { class: 'panel-h' }, 'SCIENCE — FULL CONSOLE'),
    el('div', { class: 'small dim', style: 'margin-bottom:12px;' }, 'Lab assignment, personnel pool, research projects, and sensor analysis.'),
    el('a', { class: 'link-btn', href: 'science.html' }, 'Open Full Science Console \u2192')
  ]));
}

function renderSecurityTab(c) {
  const p = el('div', { class: 'panel' });
  p.appendChild(el('div', { class: 'panel-h' }, 'SECURITY — QUICK CONTROL'));
  p.appendChild(el('div', { class: 'tiny dimmer', style: 'margin-bottom:12px;' }, 'Brig snapshot, plus a quick detain action without opening the full console.'));
  p.appendChild(el('div', { class: 'small dim', style: 'margin-bottom:14px;' }, 'Brig \u2014 Free ' + (6 - STATE.secBrigOccupied) + ' / 6'));
  const row = el('div', { class: 'row items-end gap-8 wrap' });
  const nameIn = el('input', { type: 'text', value: STATE.secQuickName, style: 'width:100%;' }); nameIn.onchange = (e) => { STATE.secQuickName = e.target.value; persist(); };
  row.appendChild(el('div', { class: 'col flex-grow', style: 'min-width:200px;' }, [el('label', { class: 'label' }, 'Name'), nameIn]));
  row.appendChild(el('button', { class: 'btn btn-accent', onclick: () => {
    const name = STATE.secQuickName.trim(); if (!name) return;
    STATE.secBrigOccupied = Math.min(6, STATE.secBrigOccupied + 1);
    STATE.secLogText = name + ' detained in the Brig.'; STATE.secQuickName = '';
    persist(); renderContent();
  } }, 'Quick Detain'));
  p.appendChild(row);
  if (STATE.secLogText) p.appendChild(el('div', { class: 'tiny', style: 'color:#e8a33d; margin-top:10px;' }, STATE.secLogText));
  c.appendChild(p);
  c.appendChild(el('div', { class: 'panel' }, [
    el('div', { class: 'panel-h' }, 'SECURITY — FULL CONSOLE'),
    el('div', { class: 'small dim', style: 'margin-bottom:12px;' }, 'Armory inventory, personnel pool, brig/detainee management, and security alerts.'),
    el('a', { class: 'link-btn', href: 'security.html' }, 'Open Full Security Console \u2192')
  ]));
}

function renderNpcShipsTab(c) {
  const p = el('div', { class:'panel' });
  p.appendChild(el('div', { class:'row justify-between items-center', style:'margin-bottom:12px;' }, [
    el('div',{class:'panel-h',style:'margin-bottom:0;'},'ACTIVE NPC SHIPS'),
    el('div', { class: 'row gap-8' }, [
      el('a',{class:'btn',style:'text-decoration:none;',href:'npc-ships.html'},'Manage Templates \u2192'),
      el('a',{class:'link-btn',style:'padding:8px 14px; font-size:12px;',href:'inventory.html'},'Open Full Inventory \u2192')
    ])
  ]));

  const genBox = el('div', { style:'padding:14px;border:1px solid var(--panel-border);border-radius:8px;background:var(--panel-bg);margin-bottom:12px;' });
  genBox.appendChild(el('div', { style:'font-size:11px;text-transform:uppercase;letter-spacing:0.06em;color:#e8a33d;margin-bottom:10px;' }, 'Quick Generate NPC (On the Fly)'));
  const genRow1 = el('div', { class:'row gap-8 wrap', style:'margin-bottom:10px;' });
  const designIn = el('input', { type:'text', placeholder:'e.g. Hunter Vessel Beta', value: STATE.genDesignation, style:'width:100%;' }); designIn.onchange = (e) => { STATE.genDesignation = e.target.value; persist(); };
  const originIn = el('input', { type:'text', placeholder:'e.g. Orion', value: STATE.genOrigin, style:'width:100%;' }); originIn.onchange = (e) => { STATE.genOrigin = e.target.value; persist(); };
  const classIn = el('input', { type:'text', placeholder:'e.g. Raider', value: STATE.genClass, style:'width:100%;' }); classIn.onchange = (e) => { STATE.genClass = e.target.value; persist(); };
  const lifeIn = el('input', { type:'text', value: STATE.genLifeSigns, style:'width:100%;' }); lifeIn.onchange = (e) => { STATE.genLifeSigns = e.target.value; persist(); };
  genRow1.appendChild(el('div',{class:'col flex-grow',style:'min-width:160px;'},[el('label',{class:'label'},'Designation'),designIn]));
  genRow1.appendChild(el('div',{class:'col',style:'width:140px;'},[el('label',{class:'label'},'Origin'),originIn]));
  genRow1.appendChild(el('div',{class:'col',style:'width:160px;'},[el('label',{class:'label'},'Class'),classIn]));
  genRow1.appendChild(el('div',{class:'col',style:'width:100px;'},[el('label',{class:'label'},'Life Signs'),lifeIn]));
  genBox.appendChild(genRow1);
  const genRow2 = el('div', { class:'row gap-8 wrap items-end' });
  const statFields = [['genShields','Shields %'],['genWeapons','Weapons %'],['genEngines','Engines %'],['genSensors','Sensors %']];
  statFields.forEach(([key,label]) => {
    const inp = el('input', { type:'text', value: STATE[key], style:'width:100%;' }); inp.onchange = (e) => { STATE[key] = e.target.value; persist(); };
    genRow2.appendChild(el('div',{class:'col',style:'width:90px;'},[el('label',{class:'label'},label),inp]));
  });
  genRow2.appendChild(el('button', { style:'padding:10px 18px;border-radius:6px;border:1px solid #e8a33d;background:#e8a33d1f;color:#e8a33d;font-family:"IBM Plex Sans",sans-serif;font-size:13px;font-weight:700;cursor:pointer;', onclick: () => {
    const desig = STATE.genDesignation.trim(); if (!desig) return;
    STATE.npcInstances.push({ id:'gd-gen-'+Date.now(), designation: desig, origin: STATE.genOrigin.trim() || 'Unknown', className: STATE.genClass.trim() || 'Unknown Class', templateName: desig,
      lifeSigns: STATE.genLifeSigns || '?', sysShields: STATE.genShields, sysWeapons: STATE.genWeapons, sysEngines: STATE.genEngines, sysSensors: STATE.genSensors, notes:'', damageLog:[] });
    STATE.genDesignation=''; STATE.genOrigin=''; STATE.genClass=''; STATE.genLifeSigns=''; STATE.genShields='80'; STATE.genWeapons='80'; STATE.genEngines='80'; STATE.genSensors='80';
    persist(); renderContent();
  } }, 'Generate & Add to Encounter'));
  genBox.appendChild(genRow2);
  p.appendChild(genBox);

  const addRow = el('div', { class:'row items-end gap-8', style:'margin-bottom:16px; padding:14px; border:1px solid var(--panel-border); border-radius:8px; background:var(--panel-bg);' });
  const tplSel = el('select', { style:'flex-grow:1;' });
  TEMPLATE_OPTIONS.forEach(t=>tplSel.appendChild(el('option',{value:t.id},t.name+' ('+t.origin+')')));
  tplSel.value = STATE.templateDraft; tplSel.onchange=(e)=>{STATE.templateDraft=e.target.value;persist();};
  addRow.appendChild(el('div',{class:'col flex-grow'},[el('label',{class:'label'},'Or Add Ship From Saved Templates'),tplSel]));
  addRow.appendChild(el('button', { class:'btn btn-accent', onclick: () => {
    const tpl = TEMPLATE_OPTIONS.find(t=>t.id===STATE.templateDraft) || TEMPLATE_OPTIONS[0];
    STATE.npcInstances.push({ id:'gd-inst-'+Date.now(), designation: tpl.name, origin: tpl.origin, className: tpl.className, templateName: tpl.name,
      lifeSigns: tpl.lifeSigns, sysShields: tpl.sysShields, sysWeapons: tpl.sysWeapons, sysEngines: tpl.sysEngines, sysSensors: tpl.sysSensors, notes:'', damageLog:[] });
    persist(); renderContent();
  } }, 'Add to Encounter'));
  p.appendChild(addRow);

  if (!STATE.npcInstances.length) p.appendChild(el('div',{class:'faint small'},'No active NPC ships — add one above.'));
  STATE.npcInstances.forEach((inst) => {
    const card = el('div', { class:'card' });
    const head = el('div', { class:'row justify-between items-start gap-14' });
    const left = el('div', { style:'flex-grow:1;' });
    left.appendChild(el('div', { style:'font-weight:600;' }, inst.designation));
    left.appendChild(el('div', { class:'tiny dim' }, inst.origin+' \u00b7 '+inst.className+' \u00b7 Life Signs: '+inst.lifeSigns));
    left.appendChild(el('div', { class:'tiny dimmer', style:'margin-top:4px;' }, [
      'Shields ', el('span',{style:'color:'+statusColor(inst.sysShields)+';'},inst.sysShields+'%'), ' \u00b7 Weapons ', el('span',{style:'color:'+statusColor(inst.sysWeapons)+';'},inst.sysWeapons+'%'),
      ' \u00b7 Engines ', el('span',{style:'color:'+statusColor(inst.sysEngines)+';'},inst.sysEngines+'%'), ' \u00b7 Sensors ', el('span',{style:'color:'+statusColor(inst.sysSensors)+';'},inst.sysSensors+'%')
    ]));
    if (inst.damageLog.length) { const lw=el('div',{style:'margin-top:8px;'}); inst.damageLog.forEach(t=>lw.appendChild(el('div',{class:'tiny',style:'color:#e8a33d;'},'\u2022 '+t))); left.appendChild(lw); }
    const notesTa = el('textarea', { rows:2, style:'margin-top:8px;' }, inst.notes); notesTa.onchange=(e)=>{inst.notes=e.target.value;persist();};
    left.appendChild(el('div',{class:'col',style:'margin-top:6px;'},[el('label',{class:'label'},'Notes / Disposition'),notesTa]));
    head.appendChild(left);
    const btns = el('div', { class:'col gap-8' });
    btns.appendChild(el('button', { class:'btn btn-sm', style:'border-color:#e8a33d; color:#e8a33d;', onclick: () => openDmg(inst) }, 'Log Damage'));
    btns.appendChild(el('button', { class:'btn btn-sm', onclick: () => { STATE.npcInstances = STATE.npcInstances.filter(x=>x.id!==inst.id); persist(); renderContent(); } }, 'Retire'));
    head.appendChild(btns);
    card.appendChild(head);
    card.appendChild(el('div', { id:'gd-dmg-'+inst.id }));
    p.appendChild(card);
  });
  c.appendChild(p);
}

function openDmg(inst) {
  const holder = document.getElementById('gd-dmg-'+inst.id);
  if (holder.childNodes.length) { holder.innerHTML=''; return; }
  const sel = el('select', { style:'width:140px;' }); DAMAGE_TARGETS.forEach(t=>sel.appendChild(el('option',{value:t},t)));
  const amt = el('input', { type:'text', style:'width:90px;' });
  const form = el('div', { class:'row items-end gap-8 wrap', style:'margin-top:10px; padding-top:10px; border-top:1px solid var(--panel-border);' });
  form.appendChild(el('div',{class:'col'},[el('label',{class:'label'},'System'),sel]));
  form.appendChild(el('div',{class:'col'},[el('label',{class:'label'},'Amount'),amt]));
  form.appendChild(el('button',{class:'btn btn-accent',onclick:()=>{
    const a = parseFloat(amt.value); if (isNaN(a)||a===0) { holder.innerHTML=''; return; }
    const field = DAMAGE_FIELD_MAP[sel.value]; const cur = parseFloat(inst[field])||0; const isPct = field!=='lifeSigns';
    const next = isPct?Math.max(0,Math.min(100,cur-a)):Math.max(0,cur-a);
    inst[field]=String(next); inst.damageLog.push(sel.value+' -'+a+(isPct?'% ':' ')+'(now '+next+(isPct?'%':'')+')');
    holder.innerHTML=''; persist(); renderContent();
  }},'Apply'));
  form.appendChild(el('button',{class:'btn',onclick:()=>{holder.innerHTML='';}},'Cancel'));
  holder.appendChild(form);
}

function renderContent() {
  renderTabs();
  const c = document.getElementById('tab-content'); c.innerHTML = '';
  if (STATE.activeTab==='tactical') renderTacticalTab(c);
  else if (STATE.activeTab==='engineering') renderEngineeringTab(c);
  else if (STATE.activeTab==='science') renderScienceTab(c);
  else if (STATE.activeTab==='medical') renderMedicalTab(c);
  else if (STATE.activeTab==='security') renderSecurityTab(c);
  else if (STATE.activeTab==='navigation') c.appendChild(placeholderPanel('NAVIGATION / HELM','Not yet designed. This will cover course plotting, warp/impulse speed control, and heading/position.'));
  else if (STATE.activeTab==='characters') renderCharactersTab(c);
  else if (STATE.activeTab==='npcships') renderNpcShipsTab(c);
  renderShipChat(document.getElementById('ship-chat'), () => STATE.shipChatLog, (text) => { STATE.shipChatLog.push({ from: 'You', text: text }); persist(); });
}

applyTheme(); renderAlertButtons(); renderContent();
</script>
</body>
</html>

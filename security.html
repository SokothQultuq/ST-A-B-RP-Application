<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Security — STAB Demo</title>
<link rel="stylesheet" href="style.css">
<script src="utils.js"></script>
</head>
<body>
<div class="app-frame">
  <div class="nav-links">
    <a href="index.html">&larr; Demo Home</a>
    <a href="character-screen.html">Character Screen</a>
    <a href="engineering.html">Engineering</a>
    <a href="gd-console.html">GD Console</a>
  </div>
  <div class="top-bar">
    <div><div class="eyebrow">Security Console</div><div class="title" style="font-size:20px;">USS Tempest &middot; Armory &amp; Brig</div></div>
    <div class="row gap-8" id="alert-buttons"></div>
  </div>
  <div class="divider"></div>

  <div class="grid" style="grid-template-columns: 300px 1fr; gap:14px; flex-grow:1; min-height:0;">
    <div class="col gap-12" style="overflow:auto;">
      <div class="panel"><div class="panel-h">SECURITY PERSONNEL</div><div id="personnel-list" class="col gap-6"></div></div>
      <div class="panel" style="flex-grow:1;overflow:auto;">
        <div class="panel-h">ARMORY INVENTORY</div>
        <div class="tiny dimmer" style="text-transform:uppercase;letter-spacing:0.06em;margin-bottom:6px;">Weapons</div>
        <div id="weapons-list" class="col gap-4" style="margin-bottom:12px;"></div>
        <div class="tiny dimmer" style="text-transform:uppercase;letter-spacing:0.06em;margin-bottom:6px;">Explosives (Cases)</div>
        <div id="explosives-list" class="col gap-4"></div>
      </div>
    </div>
    <div class="col gap-12" style="overflow:auto;">
      <div class="panel">
        <div class="panel-h">SECURITY ALERTS</div>
        <div class="row gap-8 wrap" id="alert-action-buttons"></div>
        <div id="alert-log" class="col gap-3" style="margin-top:10px;"></div>
      </div>
      <div class="panel">
        <div class="panel-h">INTERNAL SENSORS</div>
        <div class="tiny faint" style="margin-bottom:10px;">Security breach detections triggered by the GD.</div>
        <div id="breach-list" class="col gap-10"></div>
      </div>
      <div class="panel" style="flex-grow:1;overflow:auto;">
        <div class="panel-h">BRIG</div>
        <div id="brig-summary" class="small dim" style="margin-bottom:10px;"></div>
        <div class="row items-end gap-8 wrap" style="padding:14px;border:1px solid var(--panel-border);border-radius:8px;background:#0f151a;margin-bottom:14px;">
          <div class="col flex-grow" style="min-width:180px;"><label class="label">Detainee Name</label><input id="detain-name" type="text"></div>
          <div class="col flex-grow" style="min-width:180px;"><label class="label">Reason</label><input id="detain-reason" type="text" placeholder="e.g. Disorderly conduct"></div>
          <button class="btn btn-accent" id="detain-btn">Detain</button>
        </div>
        <div id="detainee-list" class="col gap-10"></div>
      </div>
    </div>
  </div>

  <div class="chat-box" id="ship-chat"></div>
</div>

<script>
const BASE_ACCENT = '#4a9eff';
const STATE = loadState('security', {
  alertLevel: 'normal',
  personnelPool: {
    tacticalOfficers: { label: 'Tactical Officers', total: 15, allocated: 0 },
    securityOfficers: { label: 'Security Officers', total: 111, allocated: 0 },
    armoryOfficers: { label: 'Armory Officers', total: 45, allocated: 0 }
  },
  alertLog: [],
  breaches: [
    { id: 'br-1', message: 'Unauthorized access attempt', location: 'Deck 15, Primary Armory', timestamp: '18:42', status: 'new', dispatched: null },
    { id: 'br-2', message: 'Motion detected \u2014 restricted section', location: 'Deck 9, Cargo Bay 2', timestamp: '18:47', status: 'new', dispatched: null }
  ],
  brig: { total: 6, occupied: 0 },
  detainees: [],
  shipChatLog: [
    { from: 'GD', text: 'Security team dispatched to Deck 9.' },
    { from: 'Lt. Kade', text: 'On our way.' }
  ]
});
function persist() { saveState('security', STATE); }
function applyTheme() { applyAlertTheme(STATE.alertLevel, BASE_ACCENT); }
const WEAPONS = [{ name: 'Type I Phaser', count: 800 }, { name: 'Type II Phaser', count: 600 }, { name: 'Type III Phaser Rifle', count: 225 }, { name: 'Type IIIc Phaser Compression Rifle', count: 100 }, { name: 'Type V Phaser Rifle (SAW)', count: 5 }];
const EXPLOSIVES = [{ name: 'Photon Grenades', count: 25 }, { name: 'Stun Grenades', count: 30 }, { name: 'Spatial Charges', count: 10 }];
const ALERT_DEFS = [{ key: 'lockdown', label: 'Trigger Lockdown' }, { key: 'intruder', label: 'Sound Intruder Alert' }, { key: 'security-alert', label: 'Security Alert (Deck-Wide)' }, { key: 'stand-down', label: 'Stand Down Alert' }];

function renderAlertButtons() {
  const wrap = document.getElementById('alert-buttons'); wrap.innerHTML = '';
  ['normal', 'yellow', 'red'].forEach((lvl) => {
    const labels = { normal: 'Normal', yellow: 'Yellow Alert', red: 'Red Alert' };
    wrap.appendChild(el('button', { class: 'btn' + (STATE.alertLevel === lvl ? ' btn-accent' : ''), onclick: () => { STATE.alertLevel = lvl; persist(); applyTheme(); renderAlertButtons(); } }, labels[lvl]));
  });
}
function renderPersonnel() {
  const wrap = document.getElementById('personnel-list'); wrap.innerHTML = '';
  Object.values(STATE.personnelPool).forEach((p) => {
    const free = p.total - p.allocated;
    wrap.appendChild(el('div', { style: 'border-bottom:1px solid var(--panel-border);padding-bottom:5px;' }, [
      el('div', { class: 'small dim' }, p.label),
      el('div', { class: 'tiny dimmer' }, ['Total ' + p.total + ' \u00b7 Allocated ' + p.allocated + ' \u00b7 ', el('span', { style: 'color:' + (free > 0 ? '#7fb069' : '#e05d5d') + ';' }, 'Free ' + free)])
    ]));
  });
}
function renderArmory() {
  const w = document.getElementById('weapons-list'); w.innerHTML = '';
  WEAPONS.forEach((x) => w.appendChild(el('div', { class: 'small dim' }, x.name + ': ' + x.count)));
  const ex = document.getElementById('explosives-list'); ex.innerHTML = '';
  EXPLOSIVES.forEach((x) => ex.appendChild(el('div', { class: 'small dim' }, x.name + ': ' + x.count)));
}
function renderAlertActions() {
  const wrap = document.getElementById('alert-action-buttons'); wrap.innerHTML = '';
  ALERT_DEFS.forEach((a) => wrap.appendChild(el('button', { style: 'padding:9px 14px;border-radius:6px;border:1px solid #e8a33d;background:#e8a33d1f;color:#e8a33d;font-family:"IBM Plex Sans",sans-serif;font-size:12px;font-weight:600;cursor:pointer;', onclick: () => { STATE.alertLog.unshift({ text: a.label + ' triggered.' }); STATE.alertLog = STATE.alertLog.slice(0, 5); persist(); renderAlertLog(); } }, a.label)));
}
function renderAlertLog() {
  const wrap = document.getElementById('alert-log'); wrap.innerHTML = '';
  STATE.alertLog.forEach((a) => wrap.appendChild(el('div', { class: 'tiny', style: 'color:#e8a33d;' }, a.text)));
}

const STATUS_META = { new: { label: 'New', color: '#e05d5d' }, acknowledged: { label: 'Acknowledged', color: '#e8a33d' }, dispatched: { label: 'Dispatched', color: '#7fb069' } };
function renderBreaches() {
  const wrap = document.getElementById('breach-list'); wrap.innerHTML = '';
  STATE.breaches.forEach((b) => {
    const meta = STATUS_META[b.status] || { label: b.status, color: '#9fb3c0' };
    const card = el('div', { class: 'card' });
    card.appendChild(el('div', { class: 'row justify-between items-start' }, [
      el('div', {}, [el('div', { style: 'font-weight:600;' }, b.message), el('div', { class: 'tiny dim', style: 'margin-top:2px;' }, b.location + ' \u00b7 ' + b.timestamp)]),
      el('div', { style: 'font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:' + meta.color + ';' }, meta.label)
    ]));
    const btnRow = el('div', { class: 'row gap-6', style: 'margin-top:10px;' });
    if (b.status === 'new') btnRow.appendChild(el('button', { class: 'btn btn-sm', onclick: () => { b.status = 'acknowledged'; persist(); renderBreaches(); } }, 'Acknowledge'));
    if (b.status !== 'dispatched') btnRow.appendChild(el('button', { class: 'btn btn-sm btn-accent', onclick: () => { b.dispatchOpen = !b.dispatchOpen; renderBreaches(); } }, 'Dispatch Team'));
    card.appendChild(btnRow);
    if (b.dispatchOpen) {
      const row = el('div', { class: 'row items-end gap-8 wrap', style: 'margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-border);' });
      const typeSel = el('select', { class: 'stab-input', style: 'flex-grow:1;min-width:160px;' });
      Object.entries(STATE.personnelPool).forEach(([k, p]) => typeSel.appendChild(el('option', { value: k }, p.label + ' (' + (p.total - p.allocated) + ' free)')));
      const countIn = el('input', { class: 'stab-input', type: 'text', value: '2', style: 'width:80px;' });
      row.appendChild(el('div', { class: 'col flex-grow' }, [el('label', { class: 'label' }, 'Personnel Type'), typeSel]));
      row.appendChild(el('div', { class: 'col', style: 'width:80px;' }, [el('label', { class: 'label' }, 'Count'), countIn]));
      row.appendChild(el('button', { class: 'btn btn-accent', onclick: () => {
        const typeKey = typeSel.value; const n = Math.max(1, parseInt(countIn.value, 10) || 1);
        const entry = STATE.personnelPool[typeKey]; const free = entry.total - entry.allocated;
        const actual = Math.min(n, free); if (actual <= 0) return;
        entry.allocated += actual;
        b.status = 'dispatched'; b.dispatched = { label: entry.label, count: actual }; b.dispatchOpen = false;
        persist(); renderAll();
      } }, 'Confirm'));
      card.appendChild(row);
    }
    if (b.dispatched) card.appendChild(el('div', { class: 'tiny', style: 'color:var(--accent);margin-top:8px;' }, b.dispatched.count + 'x ' + b.dispatched.label + ' dispatched.'));
    wrap.appendChild(card);
  });
}

function renderBrig() {
  const free = STATE.brig.total - STATE.brig.occupied;
  document.getElementById('brig-summary').innerHTML = '';
  document.getElementById('brig-summary').appendChild(el('span', {}, ['Cells \u2014 Total ' + STATE.brig.total + ' \u00b7 Occupied ' + STATE.brig.occupied + ' \u00b7 ', el('span', { style: 'color:' + (free > 0 ? '#7fb069' : '#e05d5d') + ';' }, 'Free ' + free)]));
  const wrap = document.getElementById('detainee-list'); wrap.innerHTML = '';
  if (!STATE.detainees.length) { wrap.appendChild(el('div', { class: 'faint small' }, 'No detainees in the Brig.')); return; }
  STATE.detainees.forEach((d) => {
    wrap.appendChild(el('div', { class: 'card', style: 'display:flex;justify-content:space-between;align-items:center;' }, [
      el('div', {}, [el('div', { style: 'font-weight:600;' }, d.name), el('div', { class: 'small dim' }, d.reason)]),
      el('button', { class: 'btn btn-sm', onclick: () => { STATE.detainees = STATE.detainees.filter((x) => x.id !== d.id); STATE.brig.occupied = Math.max(0, STATE.brig.occupied - 1); persist(); renderAll(); } }, 'Release')
    ]));
  });
}
document.getElementById('detain-btn').addEventListener('click', () => {
  const name = document.getElementById('detain-name').value.trim();
  if (!name) return;
  if (STATE.brig.occupied >= STATE.brig.total) return;
  const reason = document.getElementById('detain-reason').value.trim() || 'No reason logged';
  STATE.detainees.push({ id: 'det-' + Date.now(), name: name, reason: reason });
  STATE.brig.occupied += 1;
  document.getElementById('detain-name').value = ''; document.getElementById('detain-reason').value = '';
  persist(); renderAll();
});

function renderAll() {
  renderAlertButtons(); renderPersonnel(); renderArmory(); renderAlertActions(); renderAlertLog(); renderBreaches(); renderBrig();
  renderShipChat(document.getElementById('ship-chat'), () => STATE.shipChatLog, (text) => { STATE.shipChatLog.push({ from: 'You', text: text }); persist(); });
}
applyTheme(); renderAll();
</script>
</body>
</html>
